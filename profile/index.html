<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظرسنجی‌ساز | پروفایل</title>
  <script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #f97316; --primary-dark: #ea580c; --primary-light: #fdba74; --primary-rgb: 249, 115, 22;
      --bg: #ffffff; --bg2: #fef9f3; --bg3: #f5efe6;
      --dark: #0f172a; --text: #334155; --text-light: #94a3b8; --white: #ffffff;
      --card-bg: #ffffff; --card-border: #f0e8db;
      --shadow: 4px 4px 0 #000000; --shadow-hover: 6px 6px 0 #000000;
      --shadow-sm: 2px 2px 0 #000000;
      --header-bg: #ffffff; --footer-bg: #fef9f3;
      --overlay: rgba(249, 115, 22, 0.08);
      --logo-bg: #fef9f3;
      --footer-height: 120px;
    }

    [data-theme="dark"] {
      --primary: #f97316; --primary-dark: #ea580c; --primary-light: #fdba74; --primary-rgb: 249, 115, 22;
      --bg: #0f172a; --bg2: #1e293b; --bg3: #334155;
      --dark: #e2e8f0; --text: #cbd5e1; --text-light: #64748b; --white: #1e293b;
      --card-bg: #1e293b; --card-border: #334155;
      --shadow: 4px 4px 0 #000000; --shadow-hover: 6px 6px 0 #000000;
      --shadow-sm: 2px 2px 0 #000000;
      --header-bg: #1e293b; --footer-bg: #1e293b;
      --overlay: rgba(249, 115, 22, 0.12);
      --logo-bg: #1e293b;
    }

    body {
      font-family: 'Vazir', 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      transition: all 0.3s ease;
      display: flex; flex-direction: column;
      padding-bottom: calc(var(--footer-height) + 50px);
    }

    .header {
      background: var(--header-bg); box-shadow: 0 4px 0 #000000;
      padding: 14px 20px; position: sticky; top: 0; z-index: 100;
      border: 1px solid #000000; border-top: none; transition: all 0.3s ease;
      margin: 0 0 4px 0;
    }

    .header-inner {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; max-width: 1100px; margin: 0 auto;
    }

    .header-right { display: flex; align-items: center; gap: 10px; }

    .header-logo {
      width: 42px; height: 42px; border-radius: 4px;
      background: var(--logo-bg);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 3px 3px 0 #000000;
      padding: 4px; border: 1px solid #000000;
    }

    .header-logo img { width: 100%; height: 100%; object-fit: contain; }

    .header-title { font-size: 20px; font-weight: 700; color: var(--dark); transition: color 0.3s; }
    .header-subtitle { font-size: 10px; color: var(--text-light); transition: color 0.3s; }

    .header-btns { display: flex; align-items: center; gap: 8px; }

    .btn-back {
      display: flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: var(--primary-dark); text-decoration: none;
      padding: 8px 14px; border-radius: 4px; border: 1px solid #000000;
      transition: all 0.15s ease; white-space: nowrap;
      box-shadow: 2px 2px 0 #000000; background: var(--card-bg);
    }

    .btn-back:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000000; }

    .main-container { flex: 1; max-width: 700px; width: 100%; margin: 0 auto; padding: 20px 16px; }

    .loader-wrapper { display: flex; align-items: center; justify-content: center; min-height: 50vh; }

    .loader {
      width: 48px; height: 48px; border: 4px solid #000000;
      border-top-color: var(--primary); border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-state { display: none; text-align: center; padding: 60px 20px; color: var(--text-light); }
    .error-state i { font-size: 52px; display: block; margin-bottom: 16px; opacity: 0.6; }
    .error-state h3 { font-size: 16px; color: var(--dark); margin-bottom: 8px; }
    .error-state p { font-size: 12px; }

    .profile-content { display: none; }
    .profile-content.loaded { display: block; }
    .error-state.loaded { display: block; }

    .profile-header { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }

    .avatar-wrapper {
      position: relative; width: 70px; height: 70px; cursor: pointer; flex-shrink: 0;
    }

    .avatar-circle {
      width: 70px; height: 70px; border-radius: 4px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      display: flex; align-items: center; justify-content: center;
      font-size: 30px; color: #fff;
      box-shadow: 4px 4px 0 #000000; border: 1px solid #000000;
      transition: all 0.15s ease;
    }

    .avatar-circle:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000000; }

    .avatar-edit-badge {
      position: absolute; bottom: 0; right: 0;
      width: 24px; height: 24px; border-radius: 4px;
      background: var(--bg); border: 1px solid #000000;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--primary);
      box-shadow: 2px 2px 0 #000000;
    }

    .profile-info { flex: 1; min-width: 0; }
    .profile-name { font-size: 18px; font-weight: 700; color: var(--dark); margin-bottom: 2px; }
    .profile-id { font-size: 11px; color: var(--text-light); direction: ltr; }

    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }

    .stat-card {
      background: var(--card-bg); border: 1px solid #000000; border-radius: 4px;
      padding: 14px; text-align: center; box-shadow: 4px 4px 0 #000000;
    }

    .stat-card i { font-size: 20px; color: var(--primary); margin-bottom: 6px; display: block; }
    .stat-card .stat-value { font-size: 18px; font-weight: 700; color: var(--dark); }
    .stat-card .stat-label { font-size: 10px; color: var(--text-light); margin-top: 2px; }

    .section-title {
      font-size: 14px; font-weight: 700; color: var(--dark); margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px; transition: color 0.3s;
    }

    .section-title::after { content: ''; flex: 1; height: 2px; background: #000000; transition: background 0.3s; }

    .channels-list { margin-bottom: 24px; }

    .channel-item {
      background: var(--card-bg); border: 1px solid #000000; border-radius: 4px;
      padding: 10px 14px; margin-bottom: 6px; display: flex; align-items: center; gap: 10px;
      box-shadow: 4px 4px 0 #000000; transition: all 0.15s ease;
    }

    .channel-item i { color: var(--primary); font-size: 18px; }
    .channel-item span { font-size: 13px; color: var(--dark); flex: 1; }
    .channel-item .channel-badge { font-size: 10px; background: var(--overlay); color: var(--primary); padding: 3px 10px; border-radius: 4px; border: 1px solid #000000; }

    .no-channels { text-align: center; padding: 20px; color: var(--text-light); font-size: 12px; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center;
    }

    .modal-overlay.active { display: flex; }

    .modal-box {
      background: var(--card-bg); border-radius: 4px; padding: 20px;
      max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
      border: 1px solid #000000; box-shadow: 6px 6px 0 #000000;
    }

    .modal-title { font-size: 16px; font-weight: 700; color: var(--dark); margin-bottom: 16px; text-align: center; }

    .icons-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }

    .icon-option {
      width: 44px; height: 44px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; cursor: pointer; transition: all 0.15s ease;
      background: var(--bg2); color: var(--text); border: 1px solid #000000;
      box-shadow: 2px 2px 0 #000000;
    }

    .icon-option:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #000000; }
    .icon-option.selected { background: var(--primary); color: #fff; border-color: var(--primary); }

    .modal-close-btn {
      display: block; margin: 16px auto 0; padding: 8px 24px;
      background: var(--primary); color: #fff; border: 1px solid #000000; border-radius: 4px;
      font-size: 13px; cursor: pointer; font-family: inherit;
      box-shadow: 3px 3px 0 #000000; transition: all 0.15s ease;
    }

    .modal-close-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000000; }

    .footer {
      position: fixed; bottom: 0; left: 0; right: 0;
      text-align: center; padding: 14px 20px;
      background: var(--footer-bg); border-top: 1px solid #000000;
      transition: all 0.3s ease; z-index: 90;
    }

    .footer-stats { display: flex; justify-content: center; gap: 24px; margin-bottom: 8px; flex-wrap: wrap; }
    .footer-stat { display: flex; align-items: center; gap: 6px; }
    .footer-stat i { font-size: 14px; color: var(--primary); }
    .footer-stat span { font-size: 14px; font-weight: 700; color: var(--dark); }
    .footer-stat small { font-size: 10px; color: var(--text-light); margin-right: 2px; }

    .footer-text { font-size: 10px; color: var(--text-light); transition: color 0.3s; }

    .floating-actions {
      position: fixed;
      bottom: calc(var(--footer-height) - 30px);
      right: 24px;
      display: flex;
      gap: 10px;
      z-index: 998;
    }

    .floating-btn {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      color: #fff;
      border: 1px solid #000000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0;
      overflow: hidden;
      white-space: nowrap;
      transition: all 0.15s ease;
      box-shadow: 4px 4px 0 #000000;
      position: relative;
      direction: rtl;
      font-family: inherit;
    }

    .floating-btn.btn-support { background: #2196F3; }
    .floating-btn.btn-about { background: var(--primary); }
    .floating-btn.btn-guide { background: var(--primary); }
    .floating-btn.btn-contact { background: var(--primary); }

    .floating-btn i {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      position: absolute;
      right: 0;
      top: 0;
    }

    .floating-btn .btn-text {
      opacity: 0;
      padding: 0 56px 0 18px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      transition: opacity 0.3s ease;
      white-space: nowrap;
      direction: rtl;
      text-align: right;
    }

    .floating-btn.expanded {
      width: 150px;
      border-radius: 4px;
    }

    .floating-btn.expanded .btn-text {
      opacity: 1;
    }

    .floating-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000000; }

    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 14px;
      background: #fff;
      margin-right: 2px;
      animation: blink 0.8s infinite;
      vertical-align: middle;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @media (max-width: 768px) {
      :root { --footer-height: 130px; }
      .icons-grid { grid-template-columns: repeat(6, 1fr); }
      .header-title { font-size: 17px; }
      .stats-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat-card { padding: 10px 6px; }
      .stat-card .stat-value { font-size: 15px; }
      .floating-actions { bottom: calc(var(--footer-height) - 35px); right: 12px; gap: 8px; }
      .floating-btn { width: 42px; height: 42px; box-shadow: 3px 3px 0 #000000; }
      .floating-btn i { width: 42px; height: 42px; font-size: 16px; }
      .floating-btn .btn-text { padding: 0 48px 0 14px; font-size: 11px; }
      .floating-btn.expanded { width: 135px; }
      .footer-stats { gap: 14px; }
      .footer { padding: 10px 16px; }
    }

    @media (max-width: 400px) {
      :root { --footer-height: 140px; }
      .icons-grid { grid-template-columns: repeat(5, 1fr); }
      .icon-option { width: 38px; height: 38px; font-size: 17px; }
      .profile-header { gap: 12px; }
      .profile-name { font-size: 16px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <div class="header-right">
        <a href="../dashboard/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;">
          <div class="header-logo">
            <img src="https://cdn.imgurl.ir/uploads/a857029_InShot_20260730_155344354.png" alt="نظرسنجی‌ساز">
          </div>
          <div>
            <div class="header-title">نظرسنجی‌ساز</div>
            <div class="header-subtitle">پروفایل کاربری</div>
          </div>
        </a>
      </div>
      <div class="header-btns">
        <a href="../dashboard/" class="btn-back"><i class="fa-solid fa-arrow-right"></i> بازگشت</a>
      </div>
    </div>
  </header>

  <section class="main-container">
    <div class="loader-wrapper" id="loaderWrapper">
      <div class="loader"></div>
    </div>

    <div class="error-state" id="errorState">
      <i class="fa-solid fa-circle-exclamation"></i>
      <h3>لطفاً از طریق ایتا وارد شوید</h3>
      <p>این صفحه فقط در محیط برنامک ایتا قابل دسترسی است</p>
    </div>

    <div class="profile-content" id="profileContent">

      <div class="profile-header">
        <div class="avatar-wrapper" onclick="openAvatarModal()">
          <div class="avatar-circle" id="avatarCircle">
            <i class="fa-solid fa-user"></i>
          </div>
          <div class="avatar-edit-badge">
            <i class="fa-solid fa-pen"></i>
          </div>
        </div>
        <div class="profile-info">
          <div class="profile-name" id="profileName">کاربر</div>
          <div class="profile-id" id="profileId">—</div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card">
          <i class="fa-solid fa-square-poll-vertical"></i>
          <div class="stat-value" id="statSurveys">—</div>
          <div class="stat-label">نظرسنجی</div>
        </div>
        <div class="stat-card">
          <i class="fa-solid fa-users"></i>
          <div class="stat-value" id="statResponses">—</div>
          <div class="stat-label">پاسخ</div>
        </div>
        <div class="stat-card">
          <i class="fa-solid fa-calendar"></i>
          <div class="stat-value" id="statMember">—</div>
          <div class="stat-label">عضویت</div>
        </div>
      </div>

      <div class="section-title"><i class="fa-solid fa-link"></i> کانال‌های متصل</div>
      <div class="channels-list" id="channelsList">
        <div class="no-channels">در حال بارگذاری...</div>
      </div>

    </div>
  </section>

  <div class="floating-actions">
    <button class="floating-btn btn-support" id="floatingSupport" onclick="window.location.href='../support/'" title="پشتیبانی">
      <span class="btn-text" id="supportText"></span>
      <i class="fa-solid fa-headset"></i>
    </button>
    <button class="floating-btn btn-about" id="floatingAbout" onclick="window.location.href='../about/'" title="درباره ما">
      <span class="btn-text" id="aboutText"></span>
      <i class="fa-solid fa-circle-info"></i>
    </button>
    <button class="floating-btn btn-guide" id="floatingGuide" onclick="window.location.href='../guide/'" title="راهنما">
      <span class="btn-text" id="guideText"></span>
      <i class="fa-solid fa-book"></i>
    </button>
    <button class="floating-btn btn-contact" id="floatingContact" onclick="window.location.href='../contact/'" title="ارتباط با ما">
      <span class="btn-text" id="contactText"></span>
      <i class="fa-solid fa-phone"></i>
    </button>
  </div>

  <footer class="footer">
    <div class="footer-stats">
      <div class="footer-stat">
        <i class="fa-solid fa-eye"></i>
        <small>بازدید</small>
        <span id="footerVisits">—</span>
      </div>
      <div class="footer-stat">
        <i class="fa-solid fa-users"></i>
        <small>کاربران</small>
        <span id="footerUsers">—</span>
      </div>
      <div class="footer-stat">
        <i class="fa-solid fa-square-poll-vertical"></i>
        <small>نظرسنجی فعال</small>
        <span id="footerActive">—</span>
      </div>
    </div>
    <p class="footer-text">نظرسنجی‌ساز ایتا — کلیه حقوق محفوظ است</p>
  </footer>

  <div class="modal-overlay" id="avatarModal" onclick="closeAvatarModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div class="modal-title">انتخاب آواتار</div>
      <div class="icons-grid" id="iconsGrid"></div>
      <button class="modal-close-btn" onclick="closeAvatarModal()">تأیید</button>
    </div>
  </div>

  <script>
    (function() {
      var PUBLIC_API = 'https://script.google.com/macros/s/AKfycbyBDOkj70YUmGx5F3f3bAybEVNuU9iop8G6ibHhLYU40hQ-jGOX-6pkDLa6PpfpcWIVfw/exec';
      var PRIVATE_API = 'https://script.google.com/macros/s/AKfycbxNwRKWcYmAyQ33Jr_V1CxPwrsTpGmSswzuZVn0ENUz6RZ_NAD-1E6XCBaiKOqfnCM-XA/exec';

      var currentUser = null;
      var currentAvatar = 'fa-user';
      var allSurveysData = [];

      var iconList = [
        'fa-user', 'fa-user-tie', 'fa-user-astronaut', 'fa-user-ninja', 'fa-user-secret',
        'fa-crown', 'fa-star', 'fa-heart', 'fa-fire', 'fa-bolt',
        'fa-moon', 'fa-sun', 'fa-cloud', 'fa-umbrella', 'fa-snowflake',
        'fa-cat', 'fa-dog', 'fa-dragon', 'fa-fish', 'fa-dove',
        'fa-paw', 'fa-hippo', 'fa-otter', 'fa-crow', 'fa-feather',
        'fa-ghost', 'fa-skull', 'fa-robot', 'fa-alien', 'fa-shield',
        'fa-gem', 'fa-diamond', 'fa-bomb', 'fa-poo', 'fa-peace',
        'fa-anchor', 'fa-magnet', 'fa-guitar', 'fa-gamepad', 'fa-headphones',
        'fa-rocket', 'fa-trophy', 'fa-graduation-cap', 'fa-mask', 'fa-palette',
        'fa-code', 'fa-bug', 'fa-leaf', 'fa-seedling', 'fa-tree'
      ];

      function initTheme() {
        if (window.Eitaa && window.Eitaa.WebApp) {
          var scheme = window.Eitaa.WebApp.colorScheme;
          if (scheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
          window.Eitaa.WebApp.onEvent('themeChanged', function() {
            var newScheme = window.Eitaa.WebApp.colorScheme;
            if (newScheme === 'dark') {
              document.documentElement.setAttribute('data-theme', 'dark');
            } else {
              document.documentElement.removeAttribute('data-theme');
            }
          });
        }
      }

      function initBackButton() {
        if (window.Eitaa && window.Eitaa.WebApp) {
          window.Eitaa.WebApp.BackButton.show();
          window.Eitaa.WebApp.BackButton.onClick(function() {
            window.location.href = '../dashboard/';
          });
        }
      }

      function ready() {
        if (window.Eitaa && window.Eitaa.WebApp) {
          window.Eitaa.WebApp.ready();
        }
      }

      function safeFetch(url, options) {
        return fetch(url, options).then(function(r) {
          if (!r.ok) return null;
          return r.json().catch(function() { return null; });
        }).catch(function() {
          return null;
        });
      }

      function getInitData() {
        if (window.Eitaa && window.Eitaa.WebApp) {
          return window.Eitaa.WebApp.initData || '';
        }
        return '';
      }

      function getUserId() {
        if (window.Eitaa && window.Eitaa.WebApp && window.Eitaa.WebApp.initDataUnsafe) {
          return String(window.Eitaa.WebApp.initDataUnsafe.user && window.Eitaa.WebApp.initDataUnsafe.user.id || '');
        }
        return '';
      }

      function getFirstName() {
        if (window.Eitaa && window.Eitaa.WebApp && window.Eitaa.WebApp.initDataUnsafe) {
          return window.Eitaa.WebApp.initDataUnsafe.user && window.Eitaa.WebApp.initDataUnsafe.user.first_name || '';
        }
        return '';
      }

      function getLastName() {
        if (window.Eitaa && window.Eitaa.WebApp && window.Eitaa.WebApp.initDataUnsafe) {
          return window.Eitaa.WebApp.initDataUnsafe.user && window.Eitaa.WebApp.initDataUnsafe.user.last_name || '';
        }
        return '';
      }

      function openAvatarModal() {
        document.getElementById('avatarModal').classList.add('active');
        renderIconGrid();
      }

      function closeAvatarModal(e) {
        if (e && e.target !== document.getElementById('avatarModal')) return;
        document.getElementById('avatarModal').classList.remove('active');
      }

      function renderIconGrid() {
        var grid = document.getElementById('iconsGrid');
        grid.innerHTML = iconList.map(function(icon) {
          var selected = icon === currentAvatar ? ' selected' : '';
          return '<div class="icon-option' + selected + '" data-icon="' + icon + '" onclick="window._selectAvatar(\'' + icon + '\')"><i class="fa-solid ' + icon + '"></i></div>';
        }).join('');
      }

      window._selectAvatar = function(icon) {
        currentAvatar = icon;
        document.getElementById('avatarCircle').innerHTML = '<i class="fa-solid ' + icon + '"></i>';
        renderIconGrid();
        saveAvatar(icon);
      };

      async function saveAvatar(icon) {
        var userId = currentUser;
        if (!userId) return;

        var initData = getInitData();
        await safeFetch(PRIVATE_API, {
          method: 'POST',
          body: JSON.stringify({
            action: 'updateUser',
            avatar: icon,
            init_data: initData
          })
        });
      }

      async function loadAllData() {
        var userId = getUserId();
        currentUser = userId;

        if (!userId) {
          showError();
          return;
        }

        var fullName = (getFirstName() + ' ' + getLastName()).trim() || 'کاربر';
        document.getElementById('profileName').textContent = fullName;
        document.getElementById('profileId').textContent = 'ID: ' + userId;

        var userData = await safeFetch(PUBLIC_API + '?action=getUser&id=' + userId);
        var surveys = await safeFetch(PUBLIC_API + '?action=getSurveys&user_id=' + userId);
        var statsAll = await safeFetch(PUBLIC_API + '?action=getStats&id=all');
        var usersCount = await safeFetch(PUBLIC_API + '?action=getUsersCount');
        var activeCount = await safeFetch(PUBLIC_API + '?action=getActiveSurveysCount');

        if (userData && !userData.error) {
          if (userData.avatar && iconList.indexOf(userData.avatar) !== -1) {
            currentAvatar = userData.avatar;
          }
          if (userData.channels) {
            renderChannels(userData.channels);
          } else {
            document.getElementById('channelsList').innerHTML = '<div class="no-channels"><i class="fa-solid fa-link-slash"></i> کانالی متصل نشده است</div>';
          }
        }

        document.getElementById('avatarCircle').innerHTML = '<i class="fa-solid ' + currentAvatar + '"></i>';

        var surveyCount = 0;
        var totalResponses = 0;
        if (surveys && !surveys.error && Array.isArray(surveys)) {
          allSurveysData = surveys;
          surveyCount = surveys.length;
          surveys.forEach(function(s) {
            var p = s.participants ? s.participants.split(',').filter(function(x) { return x.trim(); }).length : 0;
            totalResponses += p;
          });
        }
        document.getElementById('statSurveys').textContent = surveyCount.toLocaleString('fa-IR');
        document.getElementById('statResponses').textContent = totalResponses.toLocaleString('fa-IR');
        document.getElementById('statMember').textContent = 'امروز';

        if (statsAll && statsAll.seen) {
          var entries = statsAll.seen.split(',').filter(function(e) { return e.trim(); });
          document.getElementById('footerVisits').textContent = entries.length.toLocaleString('fa-IR');
        }
        if (usersCount && typeof usersCount.count === 'number') {
          document.getElementById('footerUsers').textContent = usersCount.count.toLocaleString('fa-IR');
        }
        if (activeCount && typeof activeCount.count === 'number') {
          document.getElementById('footerActive').textContent = activeCount.count.toLocaleString('fa-IR');
        }

        showContent();
      }

      function renderChannels(channelsStr) {
        var list = document.getElementById('channelsList');
        var channels = channelsStr ? channelsStr.split(',').filter(function(c) { return c.trim(); }) : [];
        if (channels.length === 0) {
          list.innerHTML = '<div class="no-channels"><i class="fa-solid fa-link-slash"></i> کانالی متصل نشده است</div>';
          return;
        }
        list.innerHTML = channels.map(function(ch) {
          return '<div class="channel-item"><i class="fa-solid fa-bullhorn"></i><span>' + ch.trim() + '</span><span class="channel-badge">متصل</span></div>';
        }).join('');
      }

      function showContent() {
        document.getElementById('loaderWrapper').style.display = 'none';
        document.getElementById('profileContent').classList.add('loaded');
      }

      function showError() {
        document.getElementById('loaderWrapper').style.display = 'none';
        document.getElementById('errorState').classList.add('loaded');
      }

      function typeText(element, text, callback) {
        let i = 0;
        element.innerHTML = '<span class="typing-cursor"></span>';
        const cursor = element.querySelector('.typing-cursor');
        
        function type() {
          if (i < text.length) {
            cursor.insertAdjacentText('beforebegin', text[i]);
            i++;
            setTimeout(type, 80);
          } else {
            cursor.remove();
            if (callback) setTimeout(callback, 2000);
          }
        }
        type();
      }

      function clearText(element, callback) {
        element.textContent = '';
        if (callback) callback();
      }

      function animateFloatingButtons() {
        const buttons = [
          { btn: document.getElementById('floatingSupport'), text: document.getElementById('supportText'), label: 'پشتیبانی' },
          { btn: document.getElementById('floatingAbout'), text: document.getElementById('aboutText'), label: 'درباره ما' },
          { btn: document.getElementById('floatingGuide'), text: document.getElementById('guideText'), label: 'راهنما' },
          { btn: document.getElementById('floatingContact'), text: document.getElementById('contactText'), label: 'ارتباط با ما' }
        ];

        if (!buttons[0].btn) return;

        let currentIndex = 0;

        function cycle() {
          const current = buttons[currentIndex];
          
          current.btn.classList.add('expanded');
          typeText(current.text, current.label, () => {
            clearText(current.text);
            current.btn.classList.remove('expanded');
          });

          currentIndex = (currentIndex + 1) % buttons.length;
        }

        cycle();
        setInterval(cycle, 5000);
      }

      initTheme();
      initBackButton();
      ready();
      loadAllData();
      setTimeout(animateFloatingButtons, 1000);
    })();
  </script>

</body>
</html>
